<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Bracket, box scores, player cards and highlights for the Olin Suite Basketball League.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Olin Suite Basketball League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="app-style">
/* Layout: gym scoreboard. Header band, tab rail, then a horizontally scrolling bracket on a court-line grid; game cards open a full box-score sheet. */
:root{
  --bg:#F8FAFC; --surface:#ffffff; --surface-2:#f1f4f9; --line:#e1e5ee; --ink:#111827; --muted:#5b6475;
  --accent:#4F46E5; --accent-ink:#ffffff; --accent-soft:#eeedfd; --court:#0e7490; --cyan:#22D3EE; --win:#0f7a4a; --warn:#a85d00;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 4px 14px rgba(79,70,229,.07); --board:#111827;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111827; --surface:#182135; --surface-2:#1f2a42; --line:#2c3753; --ink:#F8FAFC; --muted:#9ba4ba;
  --accent:#6a62f0; --accent-ink:#ffffff; --accent-soft:#24224f; --court:#22D3EE; --cyan:#22D3EE; --win:#4cc38a; --warn:#f0a845;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --board:#0a0f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111827; --surface:#182135; --surface-2:#1f2a42; --line:#2c3753; --ink:#F8FAFC; --muted:#9ba4ba;
  --accent:#6a62f0; --accent-ink:#ffffff; --accent-soft:#24224f; --court:#22D3EE; --cyan:#22D3EE; --win:#4cc38a; --warn:#f0a845;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --board:#0a0f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--board);color:#F8FAFC;border-bottom:3px solid var(--accent);background-image:radial-gradient(600px 220px at 85% -40%,rgba(34,211,238,.28),transparent 70%),radial-gradient(500px 240px at 10% 140%,rgba(79,70,229,.45),transparent 70%)}
header.top .btn{background:transparent;color:#F8FAFC;border-color:rgba(248,250,252,.35)}
header.top .btn[aria-pressed="true"]{background:var(--cyan);color:#111827;border-color:var(--cyan)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 14px}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,5.4vw,52px);line-height:.92;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.brand h1 span{color:var(--cyan)}
.brand p{color:rgba(248,250,252,.7)!important}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:#c62828;border-color:transparent;background:transparent}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 14px 10px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:22px 80px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
.sec-head h2{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.sec-head p{margin:0;color:var(--muted);font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* bracket */
.bracket-scroll{overflow-x:auto;padding-bottom:8px;margin-bottom:28px;-webkit-overflow-scrolling:touch}
.bracket{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:28px;min-width:max-content;padding:4px 2px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 48px;background-position:0 28px}
.bracket.losers{grid-auto-columns:minmax(220px,260px)}
.bcol{display:flex;flex-direction:column;position:relative;z-index:1;min-width:190px}
.bcol h3{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;color:var(--muted);background:var(--bg);align-self:flex-start;padding-right:8px}
.bcol .games{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:14px}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
svg.wires path{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.55}
.gcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;box-shadow:var(--shadow);overflow:hidden;transition:transform .12s,border-color .12s}
.gcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.gcard .row{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:9px;padding:7px 12px 7px 10px;min-height:38px}
.gcard .row+.row{border-top:1px solid var(--line)}
.gcard .chip{width:8px;align-self:stretch}
.gcard .tn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gcard .tn.tbd{color:var(--muted);font-weight:500;font-style:italic;font-size:13px}
.gcard .sc{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;min-width:24px;text-align:right;color:var(--muted)}
.gcard .row.won .tn{font-weight:700}
.gcard .row.won .sc{color:var(--ink)}
.gcard .row.lost .tn{color:var(--muted)}
.gcard .meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);padding:5px 12px;background:var(--surface-2);border-top:1px solid var(--line);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.wbadge{font-family:var(--f-display);font-size:13px;font-weight:800;color:var(--win)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.pill.final{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.up{background:var(--accent-soft);color:var(--accent)}
.pill.vid{color:var(--court)}
.rr-table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rr-table th,.rr-table td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line)}
.rr-table td.n,.rr-table th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.champ{border:2px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center;background:var(--surface)}
.champ .tn{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase}
.champ.set{border-style:solid;border-color:var(--accent)}
/* avatars & players */
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;color:#fff;overflow:hidden;background:var(--muted);position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:23px}
.av.sm{width:30px;height:30px;font-size:12px}
.av.editable{cursor:pointer}
.av.editable::after{content:"＋";position:absolute;inset:auto 0 0 0;height:36%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;display:grid;place-items:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pcard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.pcard .who{min-width:0;flex:1}
.pcard .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .nk{font-size:12.5px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statline{display:flex;gap:10px;margin-top:4px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.statline b{color:var(--ink);font-weight:600}
.statline.dnp{font-family:var(--f-body);font-style:italic}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{background:var(--bg);border-radius:12px;width:min(1000px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.sheet-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-body{padding:18px;display:flex;flex-direction:column;gap:22px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--board);color:#f4f7fa;border-radius:10px;padding:18px}
.board .side{min-width:0}
.board .side.b{text-align:right}
.board .tname{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3.6vw,30px);text-transform:uppercase;line-height:1;overflow-wrap:anywhere}
.board .rec{font-size:12px;opacity:.7;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.board .nums{font-family:var(--f-num);font-weight:600;font-size:clamp(30px,6vw,52px);display:flex;gap:14px;align-items:center;font-variant-numeric:tabular-nums}
.board .nums .dash{opacity:.4;font-size:.6em}
.board .nums .w{color:var(--cyan)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two>div{min-width:0}
.team-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.team-h i{width:12px;height:12px;border-radius:3px;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.box{width:100%;border-collapse:collapse;font-size:14px}
table.box th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.box th:first-child,table.box td:first-child{text-align:left}
table.box td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
table.box td:first-child{font-family:var(--f-body);font-weight:600}
table.box tr:last-child td{border-bottom:0}
table.box th.sortable{cursor:pointer}
table.box th.on{color:var(--accent)}
table.box input{width:52px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right;font-family:var(--f-num)}
.who-cell{display:flex;align-items:center;gap:8px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vid{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.vid video{width:100%;aspect-ratio:16/9;background:#000;display:block;max-width:100%}
.vid a.thumb{aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(135deg,#4F46E5,#111827 60%,#0e7490);color:#fff;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.05em;text-transform:uppercase;gap:6px}
.vid a.thumb .play{width:54px;height:54px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:20px;color:var(--accent-ink)}
.vid .cap{padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px}
.vid .cap b{display:block}
.vid .cap span{color:var(--muted);font-size:12px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);text-align:center;background:var(--surface)}
.form-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.field input,.field select{font-size:14px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;max-width:100%}
.editbox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.editbox h4{margin:0;font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.04em}
/* leaders */
.lead-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:28px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.lcard h3{margin:0 0 8px;font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:baseline}
.lcard h3 small{font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.06em}
.lrow{display:grid;grid-template-columns:18px 30px 1fr auto;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow .rk{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.lrow .nm{font-weight:600;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.lrow .v{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.lrow.top .v{color:var(--accent);font-size:17px}
.note{font-size:13px;color:var(--muted);max-width:70ch}
/* teams */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;display:flex;flex-direction:column}
.tcard:hover{border-color:var(--accent)}
.tcard .band{height:6px}
.tcard .in{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tcard .tt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tcard .tt b{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.tcard .tt span{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap}
.faces{display:flex;flex-wrap:wrap}
.faces .av{border:2px solid var(--surface);margin-right:-8px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:600}
.savebar .btn{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.35)}
.savebar .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:40;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.editbar{background:var(--accent-soft);border-bottom:1px solid var(--accent);font-size:13.5px}
.editbar .wrap{padding-block:8px}
/* team badge */
.tb{flex:none;border-radius:7px;display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-weight:800;color:#fff;letter-spacing:.02em;position:relative}
.tb img{width:100%;height:100%;object-fit:contain;background:#fff}
.tb.editable{cursor:pointer;outline:2px dashed var(--accent);outline-offset:2px}
/* 2K cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.c2k{position:relative;display:flex;flex-direction:column;border:0;padding:0;margin:0;border-radius:14px;overflow:hidden;color:#F8FAFC;text-align:left;background:var(--tier);box-shadow:0 6px 18px rgba(17,24,39,.25);isolation:isolate;width:100%;font-family:var(--f-body);transition:transform .15s}
button.c2k:hover{transform:translateY(-3px) rotate(-.4deg)}
.c2k::before{content:"";position:absolute;inset:5px;border:1px solid rgba(248,250,252,.28);border-radius:10px;pointer-events:none;z-index:3}
.c2k::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);pointer-events:none;z-index:2}
.t-holo{--tier:linear-gradient(140deg,#4F46E5 0%,#22D3EE 38%,#c7d2fe 55%,#22D3EE 70%,#4F46E5 100%)}
.t-dia{--tier:linear-gradient(160deg,#0b3a4a 0%,#0e7490 35%,#22D3EE 60%,#0b3a4a 100%)}
.t-ame{--tier:linear-gradient(160deg,#1e1b4b 0%,#4F46E5 50%,#1e1b4b 100%)}
.t-base{--tier:linear-gradient(160deg,#111827 0%,#475569 55%,#111827 100%)}
.t-nr{--tier:linear-gradient(160deg,#1f2937,#111827)}
.c2k .ovr{position:absolute;top:12px;left:13px;z-index:4;font-family:var(--f-display);font-weight:900;font-size:36px;line-height:.82;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.c2k .ovr small{display:block;font-size:10px;letter-spacing:.16em;font-weight:800;margin-top:3px}
.c2k .tlogo{position:absolute;top:58px;left:13px;z-index:4}
.c2k .ph{aspect-ratio:1/.9;display:flex;align-items:flex-end;justify-content:center;padding-top:10px;position:relative;z-index:1}
.c2k .ph img{width:82%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.c2k .ph .ini{font-family:var(--f-display);font-weight:900;font-size:58px;opacity:.55;align-self:center;padding-left:18px}
.c2k .np{position:relative;z-index:4;background:rgba(10,15,28,.62);padding:7px 11px 9px;display:flex;flex-direction:column;gap:2px}
.c2k .nm{font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}

<body>
<div id="app"></div>
<script id="app-script">
(function(){
"use strict";
const ROUND_LABEL={W1:"Week 1",W2:"Week 2 · Winners",L2:"Week 2 · Losers",X3:"Week 3 · Crossover",WRR:"Weeks 3–4 · Winners round robin",LRR:"Week 4 · Losers round robin",QF:"Week 5 · Quarterfinal",SF:"Week 6 · Semifinal",F:"Final",L3:"Round robin"};
const gameRoundLabel=g=>g.id==="F-1"?"Week 7 · Final":g.id==="F-2"?"Week 8 · Final, if necessary":(ROUND_LABEL[g.round]||g.round);
const STATS=[["p1","1PT"],["p2","2PT"],["reb","REB"],["ast","AST"],["stl","STL"],["blk","BLK"]];
const LEAD_CATS=[["fpts","Fantasy pts"],["pts","Points"],["reb","Rebounds"],["ast","Assists"],["stl","Steals"],["blk","Blocks"],["p2","2-pointers"]];
const COLORS=["#4F46E5","#0891B2","#7C3AED","#059669","#DB2777","#2563EB","#D97706","#0D9488","#9333EA","#DC2626","#4B5563","#65A30D"];

let state={league:"Olin Suite Basketball League",season:"",teams:[],games:[]}, version=0;
let dirty=false, editMode=false, canEdit=false, artifactApi=null, assetsApi=null;
let tab="bracket";
try{const t=sessionStorage.getItem("osbl-tab"); if(t) tab=t;}catch(e){}

const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v=attrs[k]; if(v==null||v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="style") el.setAttribute("style",v);
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="html") el.innerHTML=v;
    else el.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
const teamById=id=>state.teams.find(t=>t.id===id);
const teamColor=id=>{const i=state.teams.findIndex(t=>t.id===id);return COLORS[(i<0?0:i)%COLORS.length];};
const gameById=id=>state.games.find(g=>g.id===id);
function playerById(pid){for(const t of state.teams){const p=t.players.find(p=>p.id===pid); if(p) return {p,t};} return null;}
function initials(n){const w=n.trim().split(/\s+/);return ((w[0]||"")[0]||"").toUpperCase()+((w[1]||"")[0]||"").toUpperCase();}
const num=v=>typeof v==="number"&&isFinite(v);
const fmt=v=>(Math.round(v*10)/10).toFixed(1);

/* ---------- bracket logic ---------- */
function winnerOf(id,seen){
  const g=gameById(id); if(!g) return null;
  const a=teamOf(g,"A",seen), b=teamOf(g,"B",seen);
  if(g.winner && (g.winner===a||g.winner===b||(!a&&!b))) return g.winner;
  if(a&&b&&num(g.scoreA)&&num(g.scoreB)&&g.scoreA!==g.scoreB&&Math.max(g.scoreA,g.scoreB)>=(g.target||11)) return g.scoreA>g.scoreB?a:b;
  return null;
}
function loserOf(id,seen){const g=gameById(id); const w=winnerOf(id,seen); if(!w) return null; const a=teamOf(g,"A",seen),b=teamOf(g,"B",seen); return w===a?b:w===b?a:null;}
function rrStandings(round){
  const games=state.games.filter(g=>g.round===(round||"L3"));
  const rows={};
  for(const g of games){
    const a=teamOf(g,"A"), b=teamOf(g,"B");
    for(const t of [a,b]) if(t&&!rows[t]) rows[t]={team:t,w:0,l:0,pf:0,pa:0};
    const w=winnerOf(g.id); if(!w||!a||!b) continue;
    const l=w===a?b:a; rows[w].w++; rows[l].l++;
    if(num(g.scoreA)&&num(g.scoreB)){rows[a].pf+=g.scoreA;rows[a].pa+=g.scoreB;rows[b].pf+=g.scoreB;rows[b].pa+=g.scoreA;}
  }
  const list=Object.values(rows).sort((x,y)=>y.w-x.w||(y.pf-y.pa)-(x.pf-x.pa)||y.pf-x.pf);
  const done=games.length>0&&games.every(g=>winnerOf(g.id));
  let champ=null;
  if(done&&list.length){const t=list[0],n=list[1]; if(!n||t.w>n.w||(t.pf-t.pa)>(n.pf-n.pa)) champ=t.team;}
  // ranks only count once every game is in; a full tie (same W-L, +/- and points) stays TBD
  const same=(x,y)=>x&&y&&x.w===y.w&&(x.pf-x.pa)===(y.pf-y.pa)&&x.pf===y.pf;
  const rankTeam=r=>{if(!done) return null; const t=list[r-1]; if(!t||same(t,list[r-2])||same(t,list[r])) return null; return t.team;};
  return {list,champ,done,rankTeam};
}
function teamOf(g,side,seen){
  const explicit=side==="A"?g.teamA:g.teamB; if(explicit) return explicit;
  if(g.ifNeeded&&!extraGameNeeded(g)) return null;
  const src=g.src&&g.src[side==="A"?0:1]; if(!src) return null;
  seen=seen||new Set(); if(seen.has(g.id+side)) return null; seen.add(g.id+side);
  if(src[0]==="W") return winnerOf(src[1],seen);
  if(src[0]==="L") return loserOf(src[1],seen);
  if(src[0]==="RR") return src.length>2?rrStandings(src[1]).rankTeam(src[2]):rrStandings(src[1]).champ;
  return null;
}
// The Week 8 game is only played if the losers-side team wins the Week 7 final.
function extraGameNeeded(g){
  const f=gameById(g.ifNeeded); if(!f) return false;
  const w=winnerOf(f.id); return !!w&&w===teamOf(f,"B");
}
function champion(){
  const f=gameById("F-1"); if(!f) return null;
  const w=winnerOf("F-1"); if(!w) return null;
  if(!gameById("F-2")||w===teamOf(f,"A")) return w;
  return winnerOf("F-2");
}
function srcLabel(g,side){
  const src=g.src&&g.src[side==="A"?0:1]; if(!src) return "TBD";
  if(g.ifNeeded){const f=gameById(g.ifNeeded); if(f&&winnerOf(f.id)) return "Not needed"; return side==="A"?"Wk 6 team, if they win Wk 7":"Wk 5 team, if they lose Wk 7";}
  if(src[0]==="RR"){
    if(src.length<3) return "Losers bracket champ";
    return (src[1]==="WRR"?"Winners RR #":"Losers RR #")+src[2];
  }
  const SHORT={W1:"Wk 1 G",W2:"Wk 2 G",L2:"Wk 2 Losers G",X3:"Wk 3 Crossover G",WRR:"Winners RR G",LRR:"Losers RR G",QF:"Wk 5 G",SF:"Wk 6 G",F:"Final ",L3:"Round robin G"};
  const sg=gameById(src[1]); const lab=sg?(SHORT[sg.round]||sg.round+" ")+src[1].split("-")[1]:src[1];
  return (src[0]==="W"?"Winner ":"Loser ")+lab;
}
function gameStatus(g){const w=winnerOf(g.id); return w?"final":"upcoming";}
function record(tid){let w=0,l=0;for(const g of state.games){const win=winnerOf(g.id); if(!win) continue; const a=teamOf(g,"A"),b=teamOf(g,"B"); if(win===tid) w++; else if(a===tid||b===tid) l++;} return {w,l};}

/* ---------- stats ---------- */
const pts=s=>(+s.p1||0)+2*(+s.p2||0);
const FP={pts:1,reb:1.25,ast:1.5,stl:2,blk:2};
const fpts=s=>pts(s)*FP.pts+(+s.reb||0)*FP.reb+(+s.ast||0)*FP.ast+(+s.stl||0)*FP.stl+(+s.blk||0)*FP.blk;
function played(s){return s&&STATS.some(([k])=>s[k]!==undefined&&s[k]!==null&&s[k]!=="");}
/* length of a game = points the winner actually reached (falls back to the target when no score is in) */
function gameLen(g){const m=(num(g.scoreA)&&num(g.scoreB))?Math.max(g.scoreA,g.scoreB):0; return m>0?m:(g.target||11);}
function seasonStats(){
  const out={};
  for(const g of state.games){
    const f=11/gameLen(g);
    for(const pid in (g.stats||{})){
      const s=g.stats[pid]; if(!played(s)) continue;
      const o=out[pid]||(out[pid]={gp:0,tot:{fpts:0,pts:0,p1:0,p2:0,reb:0,ast:0,stl:0,blk:0},n11:{fpts:0,pts:0,p1:0,p2:0,reb:0,ast:0,stl:0,blk:0}});
      o.gp++;
      const row={fpts:fpts(s),pts:pts(s),p1:+s.p1||0,p2:+s.p2||0,reb:+s.reb||0,ast:+s.ast||0,stl:+s.stl||0,blk:+s.blk||0};
      for(const k in row){o.tot[k]+=row[k]; o.n11[k]+=row[k]*f;}
    }
  }
  for(const pid in out){const o=out[pid]; o.per11={}; for(const k in o.n11) o.per11[k]=o.n11[k]/o.gp;}
  return out;
}

/* ---------- team badges ---------- */
function teamBadge(t,size,onEdit){
  size=size||22;
  const el=h("div",{class:"tb"+(onEdit?" editable":""),style:"width:"+size+"px;height:"+size+"px;font-size:"+Math.round(size*0.42)+"px;background:"+(t?teamColor(t.id):"var(--line)"),role:onEdit?"button":null,tabindex:onEdit?"0":null,"aria-label":onEdit?"Change logo for "+t.name:null,title:onEdit?"Change team logo":null});
  if(t&&t.logo&&/^data:image\//.test(t.logo)) el.append(h("img",{src:t.logo,alt:t.name+" logo"}));
  else if(t) el.append(initials(t.name.replace(/^the\s+/i,"")));
  if(onEdit){el.addEventListener("click",onEdit);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onEdit();}});}
  return el;
}
function pickImage(kind,cb){
  const inp=h("input",{type:"file",accept:"image/*"});
  inp.addEventListener("change",()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const img=new Image(); const url=URL.createObjectURL(f);
    img.onload=()=>{
      const S=kind==="logo"?180:280,c=document.createElement("canvas");c.width=S;c.height=S;
      const ctx=c.getContext("2d");
      if(kind==="logo"){ // fit whole logo, keep transparency
        const k=Math.min(S/img.width,S/img.height),w=img.width*k,hh=img.height*k;
        ctx.drawImage(img,(S-w)/2,(S-hh)/2,w,hh); cb(c.toDataURL("image/png"));
      } else {
        const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=Math.max(0,(img.height-m)/3);
        ctx.drawImage(img,sx,sy,m,m,0,0,S,S); cb(c.toDataURL("image/jpeg",0.82));
      }
      URL.revokeObjectURL(url);
    };
    img.onerror=()=>toast("That file could not be read as an image.");
    img.src=url;
  });
  inp.click();
}

/* ---------- ratings (OVR) ---------- */
function ratings(){
  const season=seasonStats(); const ids=Object.keys(season).filter(id=>playerById(id));
  const out={}; if(!ids.length) return out;
  const scale=(get,lo,hi)=>{const v=ids.map(get),mn=Math.min(...v),mx=Math.max(...v);
    return id=>{const x=get(id); if(mx===mn) return mx>0?hi:lo; return Math.round(lo+(hi-lo)*(x-mn)/(mx-mn));};};
  const ovr=scale(id=>season[id].per11.fpts,80,99);
  const scr=scale(id=>season[id].per11.pts,60,99), reb=scale(id=>season[id].per11.reb,60,99),
        ply=scale(id=>season[id].per11.ast,60,99), def=scale(id=>season[id].per11.stl+season[id].per11.blk,60,99);

function tierOf(o){return o==null?"t-nr":o>=95?"t-holo":o>=90?"t-dia":o>=85?"t-ame":"t-base";}

/* ---------- 2K-style player card ---------- */
function playerCard(p,t,opts){

  else ph.append(h("span",{class:"ini"},initials(p.name)));

    h("div",{class:"ovr"},r?r.ovr:"NR",h("small",null,r?"OVR":"UNRATED")),
    h("div",{class:"tlogo"},teamBadge(t,opts.big?32:24)),
    ph,
    h("div",{class:"np"},h("div",{class:"nm"},p.name),h("div",{class:"nk"},p.nick?"“"+p.nick+"”":t.name),
      h("div",{class:"at"},[["SCR",r&&r.scr],["REB",r&&r.reb],["PLY",r&&r.ply],["DEF",r&&r.def]].map(([l,v])=>h("div",null,h("b",null,v==null?"–":v),h("span",null,l))))),
    opts.line?h("div",{class:"gl"+(opts.lineMuted?" muted":"")},opts.line):"");
  return card;
}
function gameLine(s){return played(s)?pts(s)+" PTS · "+(+s.reb||0)+" REB · "+(+s.ast||0)+" AST":null;}

/* ---------- player sheet ---------- */
function openPlayer(pid,gid){
  const pt=playerById(pid); if(!pt) return; const {p,t}=pt;

  const R=ratings(), r=R[pid], season=seasonStats(), o=season[pid];
  const rank=r?Object.values(R).filter(x=>x.ovr>r.ovr).length+1:null;
  const title=[h("div",{class:"eyebrow"},t.name+(rank?" · #"+rank+" in the league":"")),h("div",{style:"font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1.1"},p.name)];
  const body=[];
  if(g) body.push(h("div",null,h("button",{class:"btn small",onclick:()=>openGame(g.id)},"← Back to game")));
  const left=h("div",{class:"pleft"},playerCard(p,t,{rating:r,big:true}));
  if(canEdit) left.append(h("div",{style:"display:flex;gap:6px;flex-wrap:wrap;justify-content:center"},
    h("button",{class:"btn small",onclick:()=>pickImage("photo",d=>{p.photo=d;markDirty();openPlayer(pid,gid);})},p.photo?"Change photo":"Add photo"),
    p.photo?h("button",{class:"btn small danger",onclick:()=>{p.photo="";markDirty();openPlayer(pid,gid);}},"Remove"):null));
  const right=h("div",{class:"pright"});
  if(g&&canEdit){
    const a=teamOf(g,"A"),b=teamOf(g,"B"); const opp=teamById(t.id===a?b:a);
    g.stats=g.stats||{};
    const cur=()=>g.stats[pid]||{};
    const ptsEl=h("b",null,""),fpEl=h("b",null,"");
    const refresh=()=>{const s=cur(); ptsEl.textContent=played(s)?pts(s):0; fpEl.textContent=played(s)?fmt(fpts(s)):"0.0";};
    const steps=h("div",{class:"steps"},STATS.map(([k,l])=>{
      const val=h("span",{class:"sv","aria-live":"polite"},String(+cur()[k]||0));
      const set=n=>{const s=g.stats[pid]||(g.stats[pid]={}); STATS.forEach(([kk])=>{if(s[kk]==null) s[kk]=0;}); s[k]=Math.max(0,n); markDirty(); const y=modalEl?modalEl.scrollTop:0; openPlayer(pid,gid); if(modalEl) modalEl.scrollTop=y;};
      return h("div",{class:"step"},h("span",{class:"sl"},l),
        h("div",{class:"sb"},h("button",{"aria-label":"Minus one "+l,onclick:()=>set((+cur()[k]||0)-1)},"−"),val,h("button",{"aria-label":"Plus one "+l,onclick:()=>set((+cur()[k]||0)+1)},"+")));
    }));

    right.append(h("div",{class:"editbox"},
      h("h4",null,"Stats vs "+(opp?opp.name:"TBD")),
      h("p",{class:"note",style:"margin:0"},gameRoundLabel(g)+" · Game "+g.id.split("-")[1]+" · game to "+(g.target||11)+". 1PT and 2PT are made shots."),
      steps,

  if(!(await loadLeague())){app.textContent=""; app.append(h("div",{class:"wrap",style:"padding-block:80px"},h("div",{class:"sec-head"},h("h2",null,"Couldn't load the league")),h("p",{class:"note"},"Refresh the page to try again."))); return;}
  try{const a=await fetch("/api/auth",{cache:"no-store"}); if(a.ok){const j=await a.json(); openEditing=!!j.open;}}catch(e){}
  if(openEditing) canEdit=true;
  else if(getKey()){canEdit=await checkKey(getKey()); if(!canEdit) setKey(null);}
  render(); refreshLogoHues();
})();
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||dirty||modalEl) return;
  const v=version; if(await loadLeague()&&version!==v){render(); refreshLogoHues();}
});
})();
</script>
